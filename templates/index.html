<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa Lucas - Grocery Price Charts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background: #f6f7fb;
        color: #1b1b1f;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 2rem;
        margin: 0;
      }

      p {
        margin: 0;
        color: #4b4b57;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 12px 30px rgba(22, 24, 35, 0.08);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }

      canvas {
        width: 100% !important;
        height: 420px !important;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        text-align: left;
        font-weight: 600;
        font-size: 0.9rem;
        padding-bottom: 8px;
        border-bottom: 1px solid #e5e7ef;
      }

      tbody td {
        padding: 8px 0;
        border-bottom: 1px solid #f0f1f6;
        font-size: 0.9rem;
      }

      .tag {
        background: #eef2ff;
        color: #3f51b5;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        canvas {
          height: 320px !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Casa Lucas Grocery Price Charts</h1>
      <p>
        Read-only pricing dashboard for 50 grocery items. Data is loaded from a
        simple key-value text file and stored in a fast in-memory hash table.
      </p>
      <span class="tag">Flask API · Chart.js</span>
    </header>

    <section class="layout">
      <div class="card">
        <h2>Price Overview</h2>
        <canvas id="priceChart" aria-label="Bar chart of grocery prices"></canvas>
      </div>
      <div class="card">
        <h2>Item List</h2>
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Price (USD)</th>
            </tr>
          </thead>
          <tbody id="priceTable"></tbody>
        </table>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const priceTable = document.getElementById("priceTable");
      const chartContext = document.getElementById("priceChart");

      async function loadPrices() {
        const response = await fetch("/api/items");
        const payload = await response.json();
        return payload.items || [];
      }

      function formatCurrency(value) {
        return `$${value.toFixed(2)}`;
      }

      function renderTable(items) {
        priceTable.innerHTML = items
          .map(
            (item) => `
            <tr>
              <td>${item.name}</td>
              <td>${formatCurrency(item.price)}</td>
            </tr>
          `
          )
          .join("");
      }

      function renderChart(items) {
        const labels = items.map((item) => item.name);
        const prices = items.map((item) => item.price);

        new Chart(chartContext, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Price (USD)",
                data: prices,
                backgroundColor: "rgba(63, 81, 181, 0.4)",
                borderColor: "rgba(63, 81, 181, 0.9)",
                borderWidth: 1.5,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                ticks: {
                  autoSkip: false,
                  maxRotation: 60,
                  minRotation: 45,
                },
              },
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: "Price in USD",
                },
              },
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                callbacks: {
                  label: (context) => `Price: ${formatCurrency(context.parsed.y)}`,
                },
              },
            },
          },
        });
      }

      async function init() {
        const items = await loadPrices();
        renderTable(items);
        renderChart(items);
      }

      init();
    </script>
  </body>
</html>
